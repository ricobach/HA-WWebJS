send_message:
  name: Send message
  description: Send text or media through a configured WWebJS sender session.
  fields:
    session:
      name: Session
      description: WWebJS session/sender name.
      required: true
      example: rico
      selector:
        text:
    target:
      name: Target
      description: International phone number or raw WWebJS chat ID.
      required: true
      example: "+4512345678"
      selector:
        text:
    message:
      name: Message
      description: Text message, or caption when media is supplied.
      required: false
      example: "Someone is at the front door"
      selector:
        text:
          multiline: true
    media:
      name: Media
      description: HTTP(S) URL or local file path for image, video, audio, or document media.
      required: false
      selector:
        text:
    image:
      name: Image
      description: Alias of media for image-focused automations.
      required: false
      selector:
        text:
    media_entity:
      name: Home Assistant media entity
      description: Camera entity to snapshot and send directly.
      required: false
      selector:
        entity:
          domain: camera
    delete_after:
      name: Delete after
      description: Delete the message after this many seconds, whether read or unread.
      required: false
      selector:
        number:
          min: 1
          max: 604800
          mode: box
          unit_of_measurement: seconds
    delete_if_unread_after:
      name: Delete if unread after
      description: Delete the message after this many seconds if WWebJS does not report that it was read.
      required: false
      selector:
        number:
          min: 1
          max: 604800
          mode: box
          unit_of_measurement: seconds
    cleanup_key:
      name: Cleanup key
      description: Logical key for temporary notifications. A newer message with the same session, target, and key deletes older tracked messages.
      required: false
      selector:
        text:
    delete_for_everyone:
      name: Delete for everyone
      description: Revoke cleanup messages for the receiver too when WhatsApp allows it.
      required: false
      default: true
      selector:
        boolean:

send_location:
  name: Send location
  description: Send the GPS location of a Home Assistant person or device tracker.
  fields:
    session:
      name: Session
      description: WWebJS session/sender name.
      required: true
      selector:
        text:
    target:
      name: Target
      description: International phone number or raw WWebJS chat ID.
      required: true
      selector:
        text:
    location_entity:
      name: Location entity
      description: Person or device tracker with latitude and longitude attributes.
      required: true
      selector:
        entity:
          domain:
            - person
            - device_tracker
    description:
      name: Description
      description: Optional WhatsApp location label. Defaults to the entity friendly name.
      required: false
      selector:
        text:
